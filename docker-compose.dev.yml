# ==============[ Klassio · Docker Compose de DESARROLLO (auto-contenido) ]=========
#
# El proyecto se sirve desde el CÓDIGO VIVO de tu PC montado como volumen
# (no usa imágenes de aplicación de Docker Hub): editas archivo y el cambio
# ya está en el contenedor. Se buildea con docker-compose.dev.yml + Dockerfile.dev.
#
# Requisitos: archivo .env.dev (copia de .env.dev.example), con APP_KEY única.
#
# Uso:   docker compose --env-file .env.dev -f docker-compose.dev.yml --profile realtime up -d --build
# Frontend:  http://localhost:200          · WebSocket directo: localhost:2001
# ================================================================================

services:
    mariadb:
        image: mariadb:11.8
        restart: unless-stopped
        security_opt:
            - "no-new-privileges:true"
        environment:
            MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
            MARIADB_DATABASE: ${DB_DATABASE}
            MARIADB_USER: ${DB_USERNAME}
            MARIADB_PASSWORD: ${DB_PASSWORD}
        expose:
            - "3306"
        volumes:
            - klassio-data:/var/lib/mysql
        networks:
            - database-network
        healthcheck:
            test:
                [
                    "CMD",
                    "mariadb-admin",
                    "ping",
                    "-h",
                    "localhost",
                    "-u",
                    "root",
                    "-p${DB_ROOT_PASSWORD}",
                ]
            interval: 20s
            timeout: 5s
            retries: 5
            start_period: 30s
        mem_limit: 1g
        cpus: "1"

    app:
        image: klassio-app:development
        build:
            context: .
            dockerfile: Dockerfile.dev
            target: development
        restart: unless-stopped
        env_file:
            - .env.dev
        volumes:
            - .:/var/www/html
            - klassio-vendor:/var/www/html/vendor
        networks:
            - app-network
            - database-network
            - realtime-network
        depends_on:
            migrate:
                condition: service_completed_successfully
        mem_limit: 768m
        cpus: "1"

    migrate:
        image: klassio-app:development
        build:
            context: .
            dockerfile: Dockerfile.dev
            target: development
        command: ["php", "artisan", "migrate", "--force"]
        restart: "no"
        security_opt:
            - "no-new-privileges:true"
        env_file:
            - .env.dev
        volumes:
            - .:/var/www/html
            - klassio-vendor:/var/www/html/vendor
        networks:
            - database-network
        depends_on:
            mariadb:
                condition: service_healthy

    nginx:
        image: klassio-web:development
        build:
            context: .
            dockerfile: Dockerfile.dev
            target: web
        restart: unless-stopped
        ports:
            - "200:80"
        volumes:
            - .:/var/www/html:ro
            - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
        networks:
            - app-network
            - realtime-network
        depends_on:
            app:
                condition: service_started
        mem_limit: 128m
        cpus: "0.25"

    reverb:
        image: klassio-app:development
        build:
            context: .
            dockerfile: Dockerfile.dev
            target: development
        command:       ["php", "artisan", "reverb:start", "--host=0.0.0.0", "--port=2001"]
        restart: unless-stopped
        env_file:
            - .env.dev
        profiles: ["realtime"]
        ports:
            - "2001:2001"
        volumes:
            - .:/var/www/html
            - klassio-vendor:/var/www/html/vendor
        networks:
            - realtime-network
            - database-network
        depends_on:
            migrate:
                condition: service_completed_successfully
        mem_limit: 256m
        cpus: "0.25"

    worker:
        image: klassio-app:development
        build:
            context: .
            dockerfile: Dockerfile.dev
            target: development
        command:       ["php", "artisan", "queue:work", "database", "--queue=default", "--tries=3", "--timeout=90"]
        restart: unless-stopped
        env_file:
            - .env.dev
        volumes:
            - .:/var/www/html
            - klassio-vendor:/var/www/html/vendor
        networks:
            - app-network
            - database-network
            - realtime-network
        depends_on:
            migrate:
                condition: service_completed_successfully
        mem_limit: 256m
        cpus: "0.25"

    scheduler:
        image: klassio-app:development
        build:
            context: .
            dockerfile: Dockerfile.dev
            target: development
        command:       ["php", "artisan", "schedule:work"]
        restart: unless-stopped
        env_file:
            - .env.dev
        volumes:
            - .:/var/www/html
            - klassio-vendor:/var/www/html/vendor
        networks:
            - app-network
            - database-network
            - realtime-network
        depends_on:
            migrate:
                condition: service_completed_successfully
        mem_limit: 256m
        cpus: "0.25"

networks:
    app-network:
    database-network:
    realtime-network:

volumes:
    klassio-data:
    klassio-vendor:
