services:
    app:
        image: klassio-app:development
        build:
            context: .
            dockerfile: Dockerfile
            target: development
        env_file:
            - .env.dev
        volumes:
            - .:/var/www/html
            - klassio-vendor:/var/www/html/vendor
        depends_on:
            migrate:
                condition: service_completed_successfully

    migrate:
        image: klassio-app:development
        build:
            context: .
            dockerfile: Dockerfile
            target: development
        command: ["php", "artisan", "migrate", "--force"]
        env_file:
            - .env.dev
        volumes:
            - .:/var/www/html
            - klassio-vendor:/var/www/html/vendor
        depends_on:
            mariadb:
                condition: service_healthy
        networks:
            - database-network
        restart: "no"

    nginx:
        image: klassio-web:development
        build:
            context: .
            dockerfile: Dockerfile
            target: web
        ports:
            - "200:80"
        volumes:
            - .:/var/www/html:ro
            - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

    reverb:
        image: klassio-app:development
        env_file:
            - .env.dev
        ports:
            - "2001:2001"
        volumes:
            - .:/var/www/html
            - klassio-vendor:/var/www/html/vendor
        networks:
            - realtime-network
            - database-network

    worker:
        image: klassio-app:development
        env_file:
            - .env.dev
        volumes:
            - .:/var/www/html
            - klassio-vendor:/var/www/html/vendor

    scheduler:
        image: klassio-app:development
        env_file:
            - .env.dev
        volumes:
            - .:/var/www/html
            - klassio-vendor:/var/www/html/vendor

volumes:
    klassio-vendor:
