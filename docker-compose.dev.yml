services:

  mariadb:
    image: mariadb:11.8
    container_name: klassio_db
    restart: unless-stopped
    command:
      - --innodb-buffer-pool-size=256M
      - --innodb-log-file-size=64M
      - --skip-name-resolve
    environment:
      - MARIADB_ROOT_PASSWORD=${DB_ROOT_PASSWORD}
      - MARIADB_DATABASE=${DB_DATABASE}
      - MARIADB_USER=${DB_USERNAME}
      - MARIADB_PASSWORD=${DB_PASSWORD}
    expose:
      - "3306"
    volumes:
      - klassio-data:/var/lib/mysql
    networks:
      - klassio-network
    healthcheck:
      test: ["CMD", "mariadb-admin","ping","-h","localhost","-u","root","-p${DB_ROOT_PASSWORD}",]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: klassio_app
    restart: unless-stopped
    env_file:
      - .env
    expose:
      - "9000"
    networks:
      - klassio-network
    volumes:
      - .:/var/www/html
      # Volúmenes nativos Linux para lo que más I/O genera en Windows.
      # El código sigue siendo tuyo (bind de arriba); esto solo acelera
      # vendor y cachés, sin cambiar funcionalidad.
      - klassio-vendor:/var/www/html/vendor
      - klassio-storage-cache:/var/www/html/storage/framework/cache
      - klassio-storage-views:/var/www/html/storage/framework/views
      - klassio-storage-sessions:/var/www/html/storage/framework/sessions
      - klassio-bootstrap-cache:/var/www/html/bootstrap/cache
    depends_on:
      mariadb:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "php -r \"exit(@fsockopen('127.0.0.1',9000)?0:1);\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s

  nginx:
    image: nginx:alpine
    container_name: klassio_nginx
    ports:
      - "200:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - klassio-network
      - proxy_network
    depends_on:
        app:
          condition: service_healthy
    restart: unless-stopped
    healthcheck:
      # /robots.txt es estático (no arranca PHP), así no se roba un worker en cada chequeo.
      test: ["CMD", "wget","--no-verbose","--tries=1","--spider", "http://127.0.0.1/robots.txt"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    
networks:
  klassio-network:
  proxy_network:
    external: true

volumes:
  klassio-data:
  klassio-vendor:
  klassio-storage-cache:
  klassio-storage-views:
  klassio-storage-sessions:
  klassio-bootstrap-cache: