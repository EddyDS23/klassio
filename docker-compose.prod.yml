services:
    app:
        image: docker.io/${DOCKERHUB_USERNAME:?Set DOCKERHUB_USERNAME in .env}/klassio:${IMAGE_TAG:-latest}-app
        env_file:
            - .env

    nginx:
        image: docker.io/${DOCKERHUB_USERNAME:?Set DOCKERHUB_USERNAME in .env}/klassio:${IMAGE_TAG:-latest}-web
        labels:
            - "traefik.enable=true"
            - "traefik.http.routers.klassio.rule=Host(`klassio.zerofall.qzz.io`)"
            - "traefik.http.routers.klassio.entrypoints=websecure"
            - "traefik.http.routers.klassio.tls.certresolver=letsencrypt"
            - "traefik.http.services.klassio.loadbalancer.server.port=80"
        networks:
            app-network: {}
            realtime-network: {}
            proxy_network:
                aliases:
                    - klassio-web

    reverb:
        image: docker.io/${DOCKERHUB_USERNAME:?Set DOCKERHUB_USERNAME in .env}/klassio:${IMAGE_TAG:-latest}-app
        env_file:
            - .env

    worker:
        image: docker.io/${DOCKERHUB_USERNAME:?Set DOCKERHUB_USERNAME in .env}/klassio:${IMAGE_TAG:-latest}-app
        env_file:
            - .env

    scheduler:
        image: docker.io/${DOCKERHUB_USERNAME:?Set DOCKERHUB_USERNAME in .env}/klassio:${IMAGE_TAG:-latest}-app
        env_file:
            - .env

networks:
    proxy_network:
        external: true
