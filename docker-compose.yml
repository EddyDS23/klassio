services:
    mariadb:
        image: mariadb:11.8
        restart: unless-stopped
        environment:
            MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
            MARIADB_DATABASE: ${DB_DATABASE}
            MARIADB_USER: ${DB_USERNAME}
            MARIADB_PASSWORD: ${DB_PASSWORD}
        expose:
            - "3306"
        volumes:
            - klassio-data:/var/lib/mysql
        networks:
            - database-network
        healthcheck:
            test:
                [
                    "CMD",
                    "mariadb-admin",
                    "ping",
                    "-h",
                    "localhost",
                    "-u",
                    "root",
                    "-p${DB_ROOT_PASSWORD}",
                ]
            interval: 20s
            timeout: 5s
            retries: 5
            start_period: 30s
        mem_limit: 2g
        cpus: "1"

    app:
        image: klassio-app:production
        restart: unless-stopped
        expose:
            - "9000"
        volumes:
            - ./storage:/var/www/html/storage
        networks:
            - app-network
            - database-network
            - realtime-network
        depends_on:
            mariadb:
                condition: service_healthy
        mem_limit: 512m
        cpus: "0.5"

    nginx:
        image: klassio-web:production
        restart: unless-stopped
        volumes:
            - ./storage:/var/www/html/storage:ro
        networks:
            - app-network
            - realtime-network
        depends_on:
            app:
                condition: service_started
        healthcheck:
            test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost/up"]
            interval: 20s
            timeout: 5s
            retries: 5
            start_period: 30s
        mem_limit: 256m
        cpus: "0.25"

    reverb:
        image: klassio-app:production
        command: ["php", "artisan", "reverb:start", "--host=0.0.0.0", "--port=2001"]
        profiles: ["realtime"]
        expose:
            - "2001"
        volumes:
            - ./storage:/var/www/html/storage
        networks:
            - realtime-network
        depends_on:
            app:
                condition: service_started
        restart: unless-stopped
        mem_limit: 256m
        cpus: "0.25"

    worker:
        image: klassio-app:production
        command: ["php", "artisan", "queue:work", "database", "--queue=default", "--tries=3", "--timeout=90"]
        restart: unless-stopped
        volumes:
            - ./storage:/var/www/html/storage
        networks:
            - database-network
            - realtime-network
        depends_on:
            mariadb:
                condition: service_healthy
            app:
                condition: service_started
        mem_limit: 256m
        cpus: "0.25"

    scheduler:
        image: klassio-app:production
        command: ["php", "artisan", "schedule:work"]
        restart: unless-stopped
        volumes:
            - ./storage:/var/www/html/storage
        networks:
            - database-network
            - realtime-network
        depends_on:
            mariadb:
                condition: service_healthy
            app:
                condition: service_started
        mem_limit: 256m
        cpus: "0.25"

networks:
    app-network:
    database-network:
    realtime-network:

volumes:
    klassio-data:
