services:

  mariadb:
    image: mariadb:11.8
    container_name: klassio_db
    environment:
      - MARIADB_ROOT_PASSWORD=${DB_ROOT_PASSWORD}
      - MARIADB_DATABASE=${DB_DATABASE}
      - MARIADB_USER=${DB_USERNAME}
      - MARIADB_PASSWORD=${DB_PASSWORD}
    expose:
      - "3306"
    volumes:
      - klassio-data:/var/lib/mysql
    networks:
      - klassio-network
    healthcheck:
      test: ["CMD", "mariadb-admin","ping","-h","localhost",-u,"root","-p${DB_PASSWORD}",]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s
    mem_limit: 2g
    cpus: "1"

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: klassio_app
    restart: unless-stopped
    env_file:
      - .env
    expose:
      - "9000"
    networks:
      - klassio-network
    volumes:
      - .:/var/www/html
    depends_on:
      mariadb:
        condition: service_healthy
    mem_limit: 512m
    cpus: "0.5"

  nginx:
    image: nginx:alpine
    container_name: klassio_nginx
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - klassio-network
      - proxy_network
    depends_on:
        app:
          condition: service_started
    restart: unless-stopped
    labels:
        - "traefik.enable=true"
        - "traefik.docker.network=proxy_network"
        - "traefik.http.routers.klassio.rule=Host(`klassio.wax`)"
        - "traefik.http.routers.klassio.entrypoints=web"
        - "traefik.http.services.klassio.loadbalancer.server.port=80"
    healthcheck:
      test: ["CMD", "curl","-fsS", "http://localhost/up"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s
    mem_limit: 256m
    cpus: "0.25"
    
networks:
  klassio-network:
  proxy_network:
    external: true

volumes:
  klassio-data: