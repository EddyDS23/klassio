; Ajustes PHP — solo rendimiento, sin cambiar comportamiento.
memory_limit=256M
max_execution_time=60
realpath_cache_size=4096K
realpath_cache_ttl=600
post_max_size=100M
upload_max_filesize=100M
max_file_uploads=20
date.timezone=UTC
; Sesiones en archivos ya se configuran por .env; esto solo acelera GC.
session.gc_maxlifetime=7200
